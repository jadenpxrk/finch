[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "finch"
version = "0.1.0"
description = "Python bindings for the finch vector database"
requires-python = ">=3.8"
license = { text = "AGPL-3.0-only" }

[tool.maturin]
python-source = "python"
module-name = "finch._finch"
features = ["extension-module"]
python-packages = ["finch"]

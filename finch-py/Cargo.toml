[package]
name = "finch-py"
version.workspace = true
edition.workspace = true

[lib]
name = "_finch"
crate-type = ["cdylib"]

[dependencies]
finch-types.workspace = true
finch-db.workspace = true
finch-memory.workspace = true
pyo3.workspace = true
thiserror.workspace = true
half.workspace = true
mimalloc = { version = "0.1", default-features = false }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

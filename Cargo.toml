[workspace]
resolver = "2"
members = [
    "crates/finch-types",
    "crates/finch-memory",
    "finch-py",
    "finch-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/jadenpxrk/finch"

[workspace.dependencies]
# Internal crates
finch-types = { path = "crates/finch-types" }
finch-memory = { path = "crates/finch-memory" }

# Float16
half = { version = "2", features = ["std", "serde"] }

# SQL parsing
sqlparser = "0.50"

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# Node.js bindings
napi = { version = "2", features = ["napi4", "serde-json"] }
napi-derive = "2"

# Locks
parking_lot = "0.12"

# Error types
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
libc = "0.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
